default_settings: null
behaviors:
  BattleBot:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 15000000
    time_horizon: 64
    summary_freq: 10000
    threaded: false
    self_play:
      save_steps: 20000
      team_change: 100000
      swap_steps: 10000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters:
  spawn_area_frac:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7533
          value: 0.25
      name: CenterSmall
      completion_criteria:
        behavior: BattleBot
        measure: progress
        min_lesson_length: 20
        signal_smoothing: true
        threshold: 0.02
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7534
          value: 0.6
      name: CenterMedium
      completion_criteria:
        behavior: BattleBot
        measure: progress
        min_lesson_length: 20
        signal_smoothing: true
        threshold: 0.05
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7535
          value: 1.0
      name: FullArena
      completion_criteria:
        behavior: BattleBot
        measure: progress
        min_lesson_length: 50
        signal_smoothing: true
        threshold: 0.07
        require_reset: false
  enable_obstacles:
